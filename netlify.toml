# Netlify: site estático, sem build. Publica a raiz do repositório.
[build]
  publish = "."
  command = ""
# Cada jogo tem repositório e deploy próprios, e aparece aqui como um caminho do domínio.
# Uma origem só para os três: é o que permite um login valer para todos, sem compartilhar
# token entre domínios.
#
# NÃO adicione um redirecionamento de /preco para /preco/ aqui. Para o motor do Netlify,
# /preco e /preco/ são o mesmo caminho: uma regra "from = /preco" casa os dois, então ela
# redireciona /preco/ para si mesmo e o navegador desiste com ERR_TOO_MANY_REDIRECTS.
# Foi o que derrubou o domínio em 18/11/2026. Testado contra o netlify-redirector, que é
# o motor de verdade: nenhuma ordem de regras separa os dois caminhos.
#
# Por isso a barra que falta é resolvida dentro de cada jogo, por uma linha no <head> do
# index.html que troca /preco por /preco/ antes de o CSS carregar.

[[redirects]]
  from = "/duelo/*"
  to = "https://duelo-matutar.netlify.app/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/preco/*"
  to = "https://qualopreco.netlify.app/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/confia/*"
  to = "https://confia-matutar.netlify.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/matutar-ui/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
