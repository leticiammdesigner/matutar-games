# Netlify: site estático, sem build. Publica a raiz do repositório.
[build]
  publish = "."
  command = ""
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/assets/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
