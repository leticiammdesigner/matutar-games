<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<title>Qual o Preço? • Matutar Games</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://matutargames.com.br/preco/">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; --fundo: #FBF6EC; --tinta: #1C1A17; --suave: #5B534A; --borda: #1C1A17; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 2rem max(16px, env(safe-area-inset-left, 0px)) 2rem max(16px, env(safe-area-inset-right, 0px));
    background: var(--fundo); color: var(--tinta);
    font: 400 1rem/1.6 "Work Sans", system-ui, -apple-system, sans-serif;
  }
  main { max-width: 30rem; text-align: center; }
  h1 { font-family: "Bricolage Grotesque", Georgia, serif; font-size: clamp(1.5rem, 6vw, 2rem); margin: 0 0 .5rem; }
  p { color: var(--suave); margin: 0 0 1.5rem; }
  a {
    display: inline-block; padding: .75rem 1.5rem; min-height: 44px;
    border: 2px solid var(--borda); border-radius: 999px;
    color: var(--tinta); text-decoration: none; font-weight: 600;
  }
  a + a { margin-left: .5rem; }
  a:hover, a:focus-visible { background: var(--tinta); color: var(--fundo); }
</style>
</head>
<body>
<main>
  <h1>Qual o Preço?</h1>
  <p>O jogo está em outro endereço no momento. É só seguir daqui.</p>
  <a href="https://qualopreco.netlify.app/">Jogar</a>
  <a href="/">Todos os jogos</a>
</main>
</body>
</html>
